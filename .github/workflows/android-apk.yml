name: Build DOME Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/android-apk-30105
    paths:
      - DOME_MOBILE_77/**
      - .github/workflows/android-apk.yml

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DOME_MOBILE_77/package-lock.json

      - name: Install npm dependencies
        working-directory: DOME_MOBILE_77
        run: npm ci --prefer-offline

      - name: Accept Android licenses and install NDK 27.1.12297006
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" || true

      - name: Setup local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > DOME_MOBILE_77/android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.1.12297006" >> DOME_MOBILE_77/android/local.properties
          cat DOME_MOBILE_77/android/local.properties

      - name: Build signed release APK
        working-directory: DOME_MOBILE_77/android
        env:
          EXPO_PUBLIC_DOME_API_BASE_URL: https://dome-telegram-bot-production-e6f6.up.railway.app
          EXPO_PUBLIC_BUILD_COMMIT: DOME-APK-30202-adaptive-voice-dialogue-20260930
          EXPO_PUBLIC_BUILD_TIMESTAMP: ${{ github.run_id }}
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare release APK asset
        id: prep_apk
        run: |
          APK_SRC=$(find DOME_MOBILE_77/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found APK at: $APK_SRC"
          ls -lh "$APK_SRC"
          cp "$APK_SRC" DOME-v3.2.2-release.apk
          ls -lh DOME-v3.2.2-release.apk
          SHA256=$(sha256sum DOME-v3.2.2-release.apk | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with direct APK download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.2-apk-${{ github.run_number }}
          name: "DOME v3.2.2 Release APK (Build ${{ github.run_number }})"
          body: |
            ## DOME Mobile v3.2.2 (versionCode 30202)

            ### Direct APK Download:
            [Download DOME-v3.2.2-release.apk](https://github.com/rufsalam-ux/dome-telegram-bot/releases/download/v3.2.2-apk-${{ github.run_number }}/DOME-v3.2.2-release.apk)

            - **SHA-256:** `${{ steps.prep_apk.outputs.sha256 }}`
            - **Исправления:**
              - Адаптивный диалог: лестница сложности 0..4 с переходом +1 при уверенном ответе и -1 при ошибке/тишине
              - Сохранение уровня сложности ребёнка между слайдами без сброса на уровень 0
              - Слайд 22/27 (Жираф): целевой объект строго привязан к жирафу, слон не подсвечивается, кнопка «Ответить» активна сразу
              - Слайд 23/27 (Белый медведь): корректное переключение контекста животного
              - Слайд 24/27 (Попугай): retry до 3 попыток при сбоях TTS, устойчивость к сетевым задержкам
              - Слайд 27/27 (Настроение): естественный финал, переход в COMPLETE и разблокировка «Завершить урок»
              - Кнопки «Прослушать» и «Перезаписать» доступны после каждого ответа при наличии аудиофайла
              - Двуязычный режим для подсказок и уточняющих вопросов: целевой язык -> язык объяснений
              - Удалён весь служебный debug-текст («Current localized wording», переменные) из child-facing UI
            - **Built on:** Ubuntu Linux (Signed Release)
          files: DOME-v3.2.2-release.apk
          draft: false
          prerelease: false

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: DOME-v3.2.2-release-apk
          path: DOME-v3.2.2-release.apk
          retention-days: 30
