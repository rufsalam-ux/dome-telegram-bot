<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DOME</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7fbff;color:#18304a}.wrap{max-width:720px;margin:auto;padding:18px}.q{font-size:24px;font-weight:800;text-align:center;margin:12px 0 20px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:4px solid transparent;border-radius:28px;background:#fff;padding:10px;box-shadow:0 8px 24px #17365420;text-align:center;transition:.25s}.card img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:20px}.card b{font-size:20px}.card.good{border-color:#62c98d;transform:scale(1.06);box-shadow:0 0 0 7px #bff2d4,0 14px 32px #62c98d55;animation:bounce .55s ease}.card.bad{animation:shake .38s ease}.stars{height:48px;text-align:center;font-size:34px;margin-top:15px}.hint{text-align:center;font-size:15px;color:#637083;margin-top:8px}@keyframes bounce{50%{transform:scale(1.11) translateY(-8px)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head><body><div class="wrap"><div class="q" id="q"></div><div class="cards" id="cards"></div><div class="stars" id="stars"></div><div class="hint" id="hint"></div></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}const q=new URLSearchParams(location.search);const animals=[q.get('a'),q.get('b')],labels={[q.get('a')]:q.get('la'),[q.get('b')]:q.get('lb')},correct=q.get('correct'),pair=q.get('pair'),slide=q.get('slide'),qi=Number(q.get('qi')||0),native=q.get('native')||'ru';document.getElementById('q').textContent=q.get('question')||'';document.getElementById('hint').textContent=native==='ru'?'Нажми на правильную картинку':'Tap the correct picture';const cards=document.getElementById('cards');
function done(id,card){if(id!==correct){card.classList.remove('bad');void card.offsetWidth;card.classList.add('bad');return}card.classList.add('good');document.getElementById('stars').textContent='✨ ⭐ ✨';try{const a=new Audio('/media/fanfare.wav');a.volume=.22;a.play()}catch(e){};setTimeout(()=>{const p={type:'animal_compare',pair,slide,qi,selected:id,correct:true};if(tg){tg.sendData(JSON.stringify(p));setTimeout(()=>tg.close(),350)}},800)}
animals.forEach(id=>{const c=document.createElement('button');c.className='card';c.innerHTML=`<img src="/assets/animals/${id}.png" alt="${labels[id]||id}" onerror="this.closest('.card').disabled=true;document.getElementById('hint').textContent=native==='ru'?'Картинка не загрузилась. Закрой и открой задание ещё раз.':'Image failed to load. Reopen the task.'"><b>${labels[id]||id}</b>`;c.onclick=()=>done(id,c);cards.append(c)});
</script></body></html>
