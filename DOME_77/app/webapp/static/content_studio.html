<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DOME Content Studio</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#20243a;background:#f3f5fa;line-height:1.35}
    *{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#20243a;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}header b{font-size:20px}header span{opacity:.7}
    main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 56px)}aside{border-right:1px solid #dce1eb;background:#fff;padding:14px;overflow:auto}.editor{padding:18px;max-width:1180px;width:100%;margin:auto}
    button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#246bfd;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#fff;color:#246bfd;border:1px solid #246bfd}button.danger{background:#b42318}button:disabled{opacity:.45;cursor:not-allowed}
    input,select,textarea{width:100%;border:1px solid #cdd4e1;border-radius:9px;background:#fff;padding:9px}textarea{min-height:92px;resize:vertical}label{display:grid;gap:5px;font-size:13px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.card{background:#fff;border:1px solid #dce1eb;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 8px #23304b0b}.lesson{display:block;width:100%;text-align:left;background:#fff;color:#20243a;border:1px solid #dce1eb;margin:7px 0}.lesson.active{border-color:#246bfd;background:#eef4ff}.lesson.drag-over,.step.drag-over{outline:3px solid #246bfd}.drag-handle{cursor:grab;padding:8px;border-radius:8px;background:#eef4ff;color:#246bfd;font-weight:800}.badge{display:inline-block;border-radius:99px;padding:2px 8px;font-size:12px;background:#e8edf5}.ok{background:#dff7e8;color:#176b38}.warn{background:#fff1ca;color:#7b5000}.error{color:#b42318;white-space:pre-wrap}.muted{color:#697386;font-size:13px}.step{border-left:5px solid #8aaefc}.step h3{margin:0}.step-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.wide{grid-column:1/-1}.hidden{display:none!important}.login{max-width:480px;margin:10vh auto}.preview{white-space:pre-wrap;max-height:320px;overflow:auto;background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;font:12px ui-monospace,monospace}.media img,.media video{display:block;max-width:100%;max-height:220px;margin-top:8px;border-radius:10px}
    @media(max-width:800px){main{grid-template-columns:1fr}aside{position:relative;border-right:0}.grid,.step-fields{grid-template-columns:1fr}.editor{padding:12px}}
  </style>
</head>
<body>
<header><b>DOME Content Studio</b><span>draft → validate → publish</span><button class="secondary" id="logout" style="margin-left:auto">Сменить token</button></header>
<section id="login" class="login card"><h1>Вход владельца</h1><p class="muted">Token хранится только в sessionStorage этого браузера и не попадает в URL.</p><label>Owner token<input id="token" type="password" autocomplete="current-password"></label><p id="loginError" class="error"></p><button id="connect">Открыть Studio</button></section>
<main id="app" class="hidden">
  <aside><div class="row space"><b>Уроки</b><button id="newLesson">＋</button></div><div id="lessonList"></div></aside>
  <section class="editor"><div id="empty"><h1>Выберите урок</h1><p class="muted">Редактирование сохраняется как draft. Мобильное приложение видит только опубликованную версию.</p></div><div id="workspace" class="hidden"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);let token=sessionStorage.getItem('dome_studio_token')||'';let catalog={lessons:[],courses:[]};let lesson=null;let detail=null;
const types=['info','listen','voice_answer','repeat_phrase','required_movie_phrase','tap_select','multiple_choice','drag_drop','matching','memory','puzzle','ordering','image_hotspots','open_dialogue','passive','choice','multi_select','sorting','tap_sound','interactive_scene','video','video_pause_question','repeat','speak','dialogue','roleplay','retell','continue_story','read_aloud','echo_reading','shared_reading','read_roles','physical_action','mood_choice','sequence','word_builder','sentence_builder','fill_gap','listen_choose','drawing','trace','coloring','maze'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(path,options={}){const headers={...(options.headers||{}),Authorization:`Bearer ${token}`};const response=await fetch(path,{...options,headers});let data={};try{data=await response.json()}catch{}if(!response.ok)throw Object.assign(new Error(data.error||`HTTP ${response.status}`),{data,status:response.status});return data}
function notice(text,error=false){let el=$('#notice');if(!el){el=document.createElement('p');el.id='notice';$('#workspace').prepend(el)}el.className=error?'error':'muted';el.textContent=text}
async function connect(){token=$('#token').value.trim()||token;try{await api('/api/studio/status');sessionStorage.setItem('dome_studio_token',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await refresh()}catch(e){$('#loginError').textContent=e.message}}
async function refresh(selectId){catalog=await api('/api/studio/lessons');renderList();if(selectId)await openLesson(selectId)}
function renderList(){const selected=lesson?.lesson_id;$('#lessonList').innerHTML=catalog.lessons.map(x=>`<button draggable="true" class="lesson ${selected===x.lesson_id?'active':''}" data-open="${esc(x.lesson_id)}" data-course="${esc(x.course_id)}"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.course_id)} · #${x.order} · ${x.slide_count} шагов</span><br><span class="badge ${x.published?'ok':'warn'}">${esc(x.publication_status||'DRAFT')}</span>${x.draft?'<span class="badge warn">есть изменения</span>':''}</button>`).join('')||'<p class="muted">Пока нет уроков</p>';document.querySelectorAll('[data-open]').forEach(b=>{b.onclick=()=>openLesson(b.dataset.open);b.ondragstart=e=>e.dataTransfer.setData('text/dome-lesson',b.dataset.open);b.ondragover=e=>{e.preventDefault();b.classList.add('drag-over')};b.ondragleave=()=>b.classList.remove('drag-over');b.ondrop=e=>{e.preventDefault();b.classList.remove('drag-over');reorderLessons(e.dataTransfer.getData('text/dome-lesson'),b.dataset.open)}})}
async function reorderLessons(sourceId,targetId){if(!sourceId||sourceId===targetId)return;const source=catalog.lessons.find(x=>x.lesson_id===sourceId),target=catalog.lessons.find(x=>x.lesson_id===targetId);if(!source||!target||source.course_id!==target.course_id)return notice('Уроки можно перетаскивать внутри одного курса',true);const rows=catalog.lessons.filter(x=>x.course_id===source.course_id);const from=rows.findIndex(x=>x.lesson_id===sourceId),to=rows.findIndex(x=>x.lesson_id===targetId);const [moved]=rows.splice(from,1);rows.splice(to,0,moved);const orders=Object.fromEntries(rows.map((x,i)=>[x.lesson_id,i+1]));try{await api('/api/studio/lessons/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orders})});notice('Порядок сохранён как draft; опубликуйте изменённые уроки.');await refresh(lesson?.lesson_id)}catch(e){notice(e.message,true)}}
async function openLesson(id){detail=await api(`/api/studio/lessons/${id}`);lesson=structuredClone(detail.lesson);renderList();renderEditor()}
function val(id,value){const el=document.getElementById(id);if(el)el.value=value??''}
function bind(id,key,transform=v=>v){const el=document.getElementById(id);el.oninput=()=>lesson[key]=transform(el.value)}
function renderEditor(){if(!lesson)return;$('#empty').classList.add('hidden');$('#workspace').classList.remove('hidden');const status=detail.summary;$('#workspace').innerHTML=`
  <div class="row space"><div><h1 style="margin:0">${esc(lesson.title||lesson.lesson_id)}</h1><span class="badge ${status.published?'ok':'warn'}">${esc(status.publication_status||'DRAFT')}</span>${status.draft?'<span class="badge warn">draft changes</span>':''}</div><div class="row"><button id="save">Сохранить draft</button><button class="secondary" id="validate">Проверить</button><button id="publish">Опубликовать</button><button class="danger" id="archive">Снять с публикации</button></div></div>
  <p id="notice" class="muted">Изменения не видны детям до публикации.</p>
  <div class="card"><h2>Настройки урока</h2><div class="grid">
    <label>ID<input id="lessonId" disabled value="${esc(lesson.lesson_id)}"></label><label>Название<input id="title" value="${esc(lesson.title)}"></label><label>Курс<select id="course">${catalog.courses.map(c=>`<option value="${esc(c.course_id)}" ${c.course_id===lesson.course_id?'selected':''}>${esc(c.title)}${c.active?'':' (off)'}</option>`).join('')}</select></label>
    <label>Порядок<input id="order" type="number" value="${Number(lesson.order||9999)}"></label><label>Target language<input id="target" value="${esc(lesson.target_language||'en')}"></label><label>Уровень<select id="difficulty"><option>PRE_A1</option><option>A1</option><option>A2</option><option>B1</option></select></label>
    <label>Возраст от<input id="ageMin" type="number" min="2" max="18" value="${Number(lesson.age_min||4)}"></label><label>Возраст до<input id="ageMax" type="number" min="2" max="18" value="${Number(lesson.age_max||10)}"></label><label>Language pair<input id="languagePair" value="${esc(lesson.language_pair||`${lesson.native_language_mode||'child_profile'}→${lesson.target_language||'en'}`)}"></label>
    <label>Explanation language mode<input id="nativeMode" value="${esc(lesson.native_language_mode||'child_profile')}"></label><label>Avatar placement<input id="heroPlacement" value="${esc(lesson.default_hero_placement||'right')}"></label><label>Animation mode<input id="animation" value="${esc(lesson.character_animation||'auto')}"></label>
    <label class="wide">Default AI prompt<textarea id="defaultPrompt">${esc(lesson.default_prompt||'')}</textarea></label><label class="wide">Movie base video path (пусто = без фильма)<input id="cartoonBase" value="${esc(lesson.cartoon_base||'')}"></label><label class="wide">Movie timeline JSON<textarea id="timeline">${esc(JSON.stringify(lesson.timeline||[],null,2))}</textarea></label>
    <label class="wide">Описание<textarea id="description">${esc(lesson.description||'')}</textarea></label>
  </div><p class="muted">Production policies фиксированы: expiration 10 месяцев, максимум 2 завершённых прохождения (QA grant проверяется сервером отдельно).</p></div>
  <div class="row space"><h2>Шаги (${lesson.slides?.length||0})</h2><button id="addStep">＋ Добавить шаг</button></div><div id="steps"></div>
  <div class="card media"><h2>Медиа</h2><p class="muted">PNG/JPG/WebP/GIF, MP4/WebM/MOV, MP3/M4A/OGG/WAV. Файл получает immutable versioned имя.</p><div class="row"><input id="mediaFile" type="file" style="max-width:480px"><button id="upload">Загрузить</button></div><div id="mediaList"></div></div>
  <div class="card"><div class="row space"><h2>Версии и действия</h2><button class="secondary" id="duplicate">Дублировать</button><button class="danger" id="delete">Удалить persistent-копию</button></div><label>Rollback version<select id="version"><option value="">Выберите…</option>${(detail.versions||[]).map(v=>`<option>${esc(v)}</option>`).join('')}</select></label><button class="secondary" id="rollback" style="margin-top:8px">Откатить опубликованную версию</button></div>
  <div class="card"><div class="row space"><h2>Preview данных</h2><button class="secondary" id="previewBtn">Обновить preview</button></div><pre id="preview" class="preview">${esc(JSON.stringify(lesson,null,2))}</pre></div>`;
  val('difficulty',lesson.difficulty||'PRE_A1');bind('title','title');bind('course','course_id');bind('order','order',Number);bind('target','target_language');bind('difficulty','difficulty');bind('ageMin','age_min',Number);bind('ageMax','age_max',Number);bind('languagePair','language_pair');bind('nativeMode','native_language_mode');bind('heroPlacement','default_hero_placement');bind('animation','character_animation');bind('defaultPrompt','default_prompt');bind('cartoonBase','cartoon_base');bind('timeline','timeline',value=>{try{return JSON.parse(value||'[]')}catch{return lesson.timeline||[]}});bind('description','description');
  $('#save').onclick=save;$('#validate').onclick=validateLesson;$('#publish').onclick=publish;$('#archive').onclick=archiveLesson;$('#addStep').onclick=()=>{lesson.slides=lesson.slides||[];lesson.slides.push({slide_id:`step_${String(lesson.slides.length+1).padStart(2,'0')}`,order:lesson.slides.length+1,type:'info',prompt:'',requiredForMovie:false,max_attempts:3,media_sequence:[]});renderSteps()};
  $('#upload').onclick=upload;$('#duplicate').onclick=duplicate;$('#delete').onclick=removeLesson;$('#rollback').onclick=rollback;$('#previewBtn').onclick=preview;renderSteps();renderMedia()}
function renderSteps(){const root=$('#steps');root.innerHTML=(lesson.slides||[]).map((s,i)=>`<div class="card step" data-step="${i}"><div class="row space"><div class="row"><span class="drag-handle" draggable="true" data-step-handle="${i}" title="Перетащить шаг">↕</span><h3>${i+1}. ${esc(s.slide_id||'без id')}</h3></div><div class="row"><button class="secondary" data-up="${i}" ${i===0?'disabled':''}>↑</button><button class="secondary" data-down="${i}" ${i===lesson.slides.length-1?'disabled':''}>↓</button><button class="secondary" data-copy="${i}">Копия</button><button class="danger" data-remove="${i}">×</button></div></div><div class="step-fields">
 <label>Step ID<input data-field="slide_id" value="${esc(s.slide_id)}"></label><label>Activity type<select data-field="type">${types.map(t=>`<option ${t===(s.type||'passive')?'selected':''}>${t}</option>`).join('')}</select></label>
 <label class="wide">AI prompt / question<textarea data-field="prompt">${esc(s.prompt||s.question||'')}</textarea></label><label>Home language hint<textarea data-field="home_language_hint">${esc(s.home_language_hint||s.bot_explains_native||'')}</textarea></label><label>Examples (по одному в строке)<textarea data-field="examples">${esc(Array.isArray(s.examples)?s.examples.join('\n'):s.examples||'')}</textarea></label>
 <label>Instruction<input data-field="instruction" value="${esc(s.instruction||'')}"></label><label>Difficulty<input data-field="difficulty" type="number" step="0.05" min="0" max="1" value="${Number(s.difficulty??.15)}"></label><label>Max attempts<input data-field="max_attempts" type="number" min="1" value="${Number(s.max_attempts||3)}"></label>
 <label>requiredForMovie<select data-field="requiredForMovie"><option value="false" ${!s.requiredForMovie&&!s.required_for_movie?'selected':''}>optional / skip allowed</option><option value="true" ${s.requiredForMovie||s.required_for_movie?'selected':''}>required / no skip</option></select></label><label>moviePhraseId<input data-field="moviePhraseId" value="${esc(s.moviePhraseId||s.required_phrase_id||'')}"></label><label>Max voice seconds<input data-field="max_voice_seconds" type="number" min="1" value="${Number(s.max_voice_seconds||5)}"></label>
 <label>Model phrase<input data-field="model_phrase" value="${esc(s.model_phrase||s.targetPhrase||'')}"></label><label>Fallback phrase<input data-field="fallback_phrase" value="${esc(s.fallback_phrase||'')}"></label><label>Hero anchor<input data-field="hero_anchor" value="${esc(s.hero_anchor||'')}"></label><label>Hero box (x,y,w,h)<input data-field="hero_box" value="${esc(Array.isArray(s.hero_box)?s.hero_box.join(','):'')}"></label>
 <label class="wide">Pre-slide video JSON<textarea data-field="preSlideVideo">${esc(JSON.stringify(s.preSlideVideo||{},null,2))}</textarea></label><label class="wide">Media sequence JSON<textarea data-field="media_sequence">${esc(JSON.stringify(s.media_sequence||[],null,2))}</textarea></label><label class="wide">Interaction config JSON<textarea data-field="interaction_json">${esc(JSON.stringify({selection_options:s.selection_options,options:s.options,items:s.items,targets:s.targets,drag_items:s.drag_items,drop_zones:s.drop_zones,pairs:s.pairs,pieces:s.pieces,card_questions:s.card_questions},null,2))}</textarea></label>
 </div></div>`).join('');
 root.querySelectorAll('[data-step]').forEach(card=>{const i=Number(card.dataset.step);card.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>setStep(i,el.dataset.field,el.value));card.ondragover=e=>{if(e.dataTransfer.types.includes('text/dome-step')){e.preventDefault();card.classList.add('drag-over')}};card.ondragleave=()=>card.classList.remove('drag-over');card.ondrop=e=>{e.preventDefault();card.classList.remove('drag-over');dropStep(Number(e.dataTransfer.getData('text/dome-step')),i)}});root.querySelectorAll('[data-step-handle]').forEach(h=>h.ondragstart=e=>e.dataTransfer.setData('text/dome-step',h.dataset.stepHandle));root.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(Number(b.dataset.up),-1));root.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(Number(b.dataset.down),1));root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyStep(Number(b.dataset.copy)));root.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Удалить этот шаг?')){lesson.slides.splice(Number(b.dataset.remove),1);renderSteps()}})}
function setStep(i,key,value){const s=lesson.slides[i];try{if(key==='difficulty'||key==='max_attempts'||key==='max_voice_seconds')s[key]=Number(value);else if(key==='requiredForMovie'){s.requiredForMovie=value==='true';s.allow_skip=!s.requiredForMovie}else if(key==='examples')s.examples=value.split('\n').map(x=>x.trim()).filter(Boolean);else if(key==='hero_box')s.hero_box=value?value.split(',').map(Number):undefined;else if(key==='media_sequence')s.media_sequence=JSON.parse(value||'[]');else if(key==='preSlideVideo')s.preSlideVideo=JSON.parse(value||'{}');else if(key==='interaction_json'){const x=JSON.parse(value||'{}');Object.entries(x).forEach(([k,v])=>{if(v===undefined)delete s[k];else s[k]=v})}else s[key]=value;$('#preview').textContent=JSON.stringify(lesson,null,2)}catch{notice(`Шаг ${i+1}: JSON пока некорректен`,true)}}
function dropStep(from,to){if(!Number.isInteger(from)||from<0||from>=lesson.slides.length||from===to)return;const [item]=lesson.slides.splice(from,1);lesson.slides.splice(to,0,item);renderSteps()}
function move(i,d){const j=i+d;if(j<0||j>=lesson.slides.length)return;[lesson.slides[i],lesson.slides[j]]=[lesson.slides[j],lesson.slides[i]];renderSteps()}
function copyStep(i){const x=structuredClone(lesson.slides[i]);x.slide_id=`${x.slide_id||'step'}_copy`;lesson.slides.splice(i+1,0,x);renderSteps()}
async function save(){try{detail=await api(`/api/studio/lessons/${lesson.lesson_id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson})});lesson=structuredClone(detail.lesson);notice(detail.validation_errors?.length?`Draft сохранён. Проверка: ${detail.validation_errors.join('; ')}`:'Draft сохранён. Ошибок в схеме нет.',Boolean(detail.validation_errors?.length));await refresh();await openLesson(lesson.lesson_id)}catch(e){notice(e.message,true)}}
async function validateLesson(){try{const r=await api(`/api/studio/lessons/${lesson.lesson_id}/validate`,{method:'POST'});notice(r.ok?'Validation PASS':r.errors.join('\n'),!r.ok)}catch(e){notice(e.message,true)}}
async function publish(){if(!confirm('Опубликовать этот draft? Мобильное приложение увидит новую revision без rebuild.'))return;try{const r=await api(`/api/studio/lessons/${lesson.lesson_id}/publish`,{method:'POST'});lesson=r.lesson;notice(`Published revision ${lesson.revision}`);await refresh(lesson.lesson_id)}catch(e){notice((e.data?.errors||[e.message]).join('\n'),true)}}
async function archiveLesson(){if(!confirm('Снять урок с публикации? Версии и media сохранятся.'))return;try{await api(`/api/studio/lessons/${lesson.lesson_id}/archive`,{method:'POST'});notice('Урок архивирован и больше не выдаётся детям.');await refresh(lesson.lesson_id)}catch(e){notice(e.message,true)}}
async function preview(){try{const r=await api(`/api/studio/lessons/${lesson.lesson_id}/preview`);$('#preview').textContent=JSON.stringify(r,null,2);notice(r.validation_errors?.length?`Preview содержит ошибки: ${r.validation_errors.join('; ')}`:'Preview готов',Boolean(r.validation_errors?.length))}catch(e){notice(e.message,true)}}
async function upload(){const file=$('#mediaFile').files[0];if(!file)return notice('Выберите файл',true);const form=new FormData();form.append('file',file);try{notice(`Загрузка ${file.name}…`);const r=await api(`/api/studio/lessons/${lesson.lesson_id}/media`,{method:'POST',body:form});notice(`Готово: ${r.path}. Вставьте path в media_sequence нужного шага.`);await openLesson(lesson.lesson_id)}catch(e){notice(e.message,true)}}
function renderMedia(){const root=$('#mediaList');root.innerHTML=(detail.media||[]).map(m=>`<div class="card" data-media-card><code>${esc(m.path)}</code> <span class="muted">${Math.ceil(m.size/1024)} KB</span><div class="row"><button class="secondary" data-copy-path="${esc(m.path)}">Копировать path</button><button class="secondary" data-preview-media="${esc(m.name)}">Preview</button></div></div>`).join('')||'<p class="muted">Загруженных persistent media пока нет.</p>';root.querySelectorAll('[data-copy-path]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copyPath));root.querySelectorAll('[data-preview-media]').forEach(b=>b.onclick=()=>previewMedia(b))}
async function previewMedia(button){try{button.disabled=true;const name=button.dataset.previewMedia;const response=await fetch(`/api/studio/lessons/${encodeURIComponent(lesson.lesson_id)}/media/${encodeURIComponent(name)}`,{headers:{Authorization:`Bearer ${token}`}});if(!response.ok)throw new Error(`HTTP ${response.status}`);const url=URL.createObjectURL(await response.blob());const ext=name.split('.').pop().toLowerCase();let media;if(['mp4','m4v','webm','mov'].includes(ext)){media=document.createElement('video');media.controls=true}else if(['mp3','m4a','ogg','wav'].includes(ext)){media=document.createElement('audio');media.controls=true}else{media=document.createElement('img')}media.src=url;button.closest('[data-media-card]').append(media)}catch(e){notice(`Media preview: ${e.message}`,true)}finally{button.disabled=false}}
async function duplicate(){const id=prompt('ID нового урока:',`${lesson.lesson_id}_copy`);if(!id)return;const title=prompt('Название:',`${lesson.title} — копия`);try{await api(`/api/studio/lessons/${lesson.lesson_id}/duplicate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson_id:id,title})});await refresh(id)}catch(e){notice(e.message,true)}}
async function removeLesson(){if(!confirm('Удалить persistent draft/live и media этого урока? Bundled original, если есть, останется.'))return;try{await api(`/api/studio/lessons/${lesson.lesson_id}`,{method:'DELETE'});lesson=null;detail=null;$('#workspace').classList.add('hidden');$('#empty').classList.remove('hidden');await refresh()}catch(e){notice(e.message,true)}}
async function rollback(){const version=$('#version').value;if(!version)return notice('Выберите version',true);if(!confirm(`Восстановить ${version}?`))return;try{await api(`/api/studio/lessons/${lesson.lesson_id}/rollback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version})});await refresh(lesson.lesson_id)}catch(e){notice(e.message,true)}}
async function createLesson(){const lesson_id=prompt('Lesson ID (a-z, 0-9, _):');if(!lesson_id)return;const title=prompt('Название урока:')||lesson_id;const course_id=prompt('Course ID:','conversation')||'conversation';try{await api('/api/studio/lessons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lesson_id,title,course_id})});await refresh(lesson_id)}catch(e){alert(e.message)}}
$('#connect').onclick=connect;$('#token').onkeydown=e=>{if(e.key==='Enter')connect()};$('#newLesson').onclick=createLesson;$('#logout').onclick=()=>{sessionStorage.removeItem('dome_studio_token');location.reload()};if(token){$('#token').value=token;connect()}
</script>
