<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DOME video</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f7f3;color:#172033}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:18px;padding:12px;box-shadow:0 2px 10px #0001}.title{font-size:20px;font-weight:800;margin:0 0 8px}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000}.q{display:none;margin-top:12px;padding:12px;border-radius:14px;background:#f0f5ff}.q.show{display:block}.opt{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid #ccd5e3;border-radius:12px;background:white;font-size:16px}.ok{background:#198a43;color:white;border:0;border-radius:12px;padding:12px;width:100%;font-weight:800}</style></head><body><div class="wrap"><div class="card"><div class="title" id="title"></div><div id="host"></div><div class="q" id="qbox"><div id="question"></div><div id="opts"></div><button class="ok" id="continue">Продолжить видео</button></div></div></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const q=new URLSearchParams(location.search);const url=q.get('url')||'';const pauseAt=Number(q.get('pause_at')||0);const question=q.get('question')||'Что ты заметил?';let options=[];try{options=JSON.parse(q.get('options')||'[]')}catch(e){};const correct=(q.get('correct_indices')||'').split(',').filter(Boolean).map(Number);document.getElementById('title').textContent=q.get('title')||'Видео';document.getElementById('question').textContent=question;const host=document.getElementById('host'),qbox=document.getElementById('qbox');let answered=null,paused=false,player=null;
function showQ(){if(paused)return;paused=true;qbox.classList.add('show');try{player?.pauseVideo?.()}catch(e){}try{document.getElementById('vid')?.pause()}catch(e){}}
function send(){const payload={type:'free_topic_task',task_type:'video_pause_question',step:Number(q.get('step')||0),answered,question,pause_at:pauseAt,completed:true};tg?.sendData(JSON.stringify(payload));setTimeout(()=>tg?.close(),250)}
options.forEach((x,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=x;b.onclick=()=>{answered=i;document.querySelectorAll('.opt').forEach(z=>z.style.outline='');b.style.outline='3px solid #86a9ff'};document.getElementById('opts').appendChild(b)});
document.getElementById('continue').onclick=()=>{if(options.length&&answered===null){document.getElementById('question').textContent=question+' — выбери ответ';return}if(correct.length&&options.length&&!correct.includes(answered)){document.getElementById('question').textContent='Попробуй ещё раз. '+question;return}qbox.classList.remove('show');paused=false;if(player?.playVideo)player.playVideo();else document.getElementById('vid')?.play();setTimeout(send,300)};
const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([A-Za-z0-9_-]{6,})/);if(yt){host.innerHTML='<div id="yt" class="video"></div>';const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:yt[1],playerVars:{playsinline:1,rel:0},events:{onReady:()=>player.playVideo(),onStateChange:()=>{}}});if(pauseAt>0)setInterval(()=>{try{if(!paused&&player.getCurrentTime()>=pauseAt)showQ()}catch(e){}},350)}}else{const v=document.createElement('video');v.id='vid';v.className='video';v.controls=true;v.playsInline=true;v.src=url;host.appendChild(v);v.addEventListener('timeupdate',()=>{if(pauseAt>0&&!paused&&v.currentTime>=pauseAt)showQ()});v.play().catch(()=>{})}
if(pauseAt<=0)setTimeout(showQ,1500);
</script></body></html>
