name: Build DOME Release APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: false
        default: 'codex/android-apk-30105'

jobs:
  build-apk:
    name: Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'codex/android-apk-30105' }}

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: DOME_MOBILE_77/package-lock.json

      - name: Install npm dependencies
        working-directory: DOME_MOBILE_77
        run: npm ci --prefer-offline

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Create local.properties
        working-directory: DOME_MOBILE_77/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> local.properties
          cat local.properties

      - name: Build Release APK
        working-directory: DOME_MOBILE_77/android
        env:
          EXPO_PUBLIC_DOME_API_BASE_URL: https://dome-telegram-bot-production-e6f6.up.railway.app
          EXPO_PUBLIC_BUILD_COMMIT: DOME-APK-30105-c08674c-20260922
          EXPO_PUBLIC_BUILD_TIMESTAMP: ${{ github.run_id }}
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -100

      - name: Find and rename APK
        id: apk
        run: |
          APK=$(find DOME_MOBILE_77/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" "DOME-v3.1.5-run${{ github.run_number }}-release.apk"
          echo "path=DOME-v3.1.5-run${{ github.run_number }}-release.apk" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOME-v3.1.5-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
