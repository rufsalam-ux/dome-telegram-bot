<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>DOME task</title><style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.w{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px #0001}h1{font-size:23px;margin:4px 0 10px}.scene{width:100%;max-height:300px;object-fit:cover;border-radius:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item,.target,.memory{padding:16px;border-radius:16px;border:2px solid #d9e1ee;background:#fff;font-size:18px;text-align:center}.item{background:#eaf3ff;touch-action:none}.target{min-height:54px}.target.good{border-color:#1f9d55;background:#e9f9ef}.target.bad{border-color:#d84a4a}.memory{background:#eaf3ff;min-height:56px}.memory.matched{background:#e9f9ef;border-color:#1f9d55;color:#166534}.selected{outline:4px solid #68a5ff}.ok{background:#178944;color:white;border:0;padding:15px;border-radius:15px;font-size:18px;width:100%;margin-top:18px}.ok:disabled{opacity:.45}.msg{text-align:center;font-weight:700;min-height:28px;margin:12px}.small{font-size:14px;color:#64748b}
</style></head><body><div class="w"><div class="card"><img id="scene" class="scene" hidden><h1 id="title">Задание</h1><p id="prompt"></p><div class="grid" id="grid"></div><div class="msg" id="msg"></div><button class="ok" id="done" disabled>Готово</button><p class="small">Задание засчитывается только после правильного выполнения.</p></div></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const q=new URLSearchParams(location.search),type=q.get('type')||'drag_drop',payloadType=q.get('payload')||'free_topic_task',title=q.get('title')||'Задание',prompt=q.get('prompt')||'',items=(q.get('items')||'').split('|').filter(Boolean),targets=(q.get('targets')||'').split('|').filter(Boolean),step=Number(q.get('step')||0),slide=q.get('slide')||'',image=q.get('image')||'';
document.getElementById('title').textContent=title;document.getElementById('prompt').textContent=prompt;const scene=document.getElementById('scene');if(image){scene.src=image;scene.hidden=false}
const g=document.getElementById('grid'),msg=document.getElementById('msg'),done=document.getElementById('done');let completed=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function finish(){completed=true;done.disabled=false;msg.textContent='✅ Готово!'}
if(type==='drag_drop'){
  const left=document.createElement('div'),right=document.createElement('div');left.style.display=right.style.display='contents';
  const shuffled=shuffle(items.map((text,i)=>({text,i})));shuffled.forEach(o=>{const e=document.createElement('div');e.className='item';e.textContent=o.text;e.draggable=true;e.dataset.pair=o.i;e.ondragstart=ev=>ev.dataTransfer.setData('text/plain',String(o.i));e.ontouchstart=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');window.__selected=o.i};g.append(e)});
  targets.forEach((text,i)=>{const t=document.createElement('div');t.className='target';t.textContent='→ '+text;t.dataset.pair=i;t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();check(Number(e.dataTransfer.getData('text/plain')),i,t)};t.onclick=()=>{if(window.__selected!==undefined)check(Number(window.__selected),i,t)};g.append(t)});
  const matched=new Set();function check(a,b,t){if(a===b){matched.add(b);t.classList.add('good');t.classList.remove('bad');document.querySelector(`.item[data-pair="${a}"]`)?.remove();window.__selected=undefined;if(matched.size===Math.min(items.length,targets.length))finish()}else{t.classList.add('bad');msg.textContent='Попробуй другое соответствие';setTimeout(()=>t.classList.remove('bad'),700)}}
}else{
  const cards=shuffle([...items.map((text,i)=>({text,i})),...targets.map((text,i)=>({text,i}))]);let first=null,matched=new Set();cards.forEach((o,n)=>{const e=document.createElement('button');e.className='memory';e.textContent=o.text;e.dataset.pair=o.i;e.onclick=()=>{if(e.classList.contains('matched'))return;if(!first){first=e;e.classList.add('selected');return}if(first===e)return;if(Number(first.dataset.pair)===o.i){matched.add(o.i);first.classList.add('matched');e.classList.add('matched');first.classList.remove('selected');first=null;if(matched.size===Math.min(items.length,targets.length))finish()}else{const old=first;first=null;old.classList.remove('selected');msg.textContent='Не пара — попробуй ещё';}};g.append(e)});
}
done.onclick=()=>{if(!completed)return;const payload={type:payloadType,task_type:type,step,slide,completed:true};if(tg){tg.sendData(JSON.stringify(payload));setTimeout(()=>tg.close(),250)}else msg.textContent=JSON.stringify(payload)};
</script></body></html>
